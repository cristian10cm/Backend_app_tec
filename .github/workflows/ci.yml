name: MyFirts Pipeline 
on:
    push:
      branches:
        - main
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: checkout version
        uses: actions/checkout@v4
      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name : pnpm install
        run: pnpm install
      - name: Generate Prisma Client
        run: pnpm prisma generate
      - name: compiled proyect
        run: pnpm build
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Creates docker images
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/taller-app:latest .
      - name: Show Docker image
        run: docker images
      - name: Push image to docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/taller-app:latest
      